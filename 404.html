<!DOCTYPE html>
﻿<!DOCTYPE html>

<html lang="hr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>S kursa — MojBiznis</title>
<meta content="noindex" name="robots"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --ink:#0D0F0E;--coral:#D46A5A;--camel:#C9AE8B;--bone:#EDE7DE;--bone-dim:#A9A49C;
    --line:rgba(237,231,222,.10);
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--ink);color:var(--bone);
    font-family:var(--sans);font-weight:300;font-size:1.05rem;line-height:1.75;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;align-items:center;min-height:100svh;
    text-align:center;padding:2rem;
  }
  ::selection{background:var(--coral);color:#0D0F0E}
  .code{font-family:var(--serif);font-size:clamp(4rem,12vw,8rem);line-height:1;color:var(--coral);margin-bottom:1rem;letter-spacing:-.04em}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.4rem,3vw,2rem);line-height:1.3;margin:0 0 1rem;letter-spacing:-.01em}
  p{color:var(--bone-dim);margin:0 0 2rem;max-width:36ch;margin-left:auto;margin-right:auto}
  a{
    color:var(--camel);text-decoration:underline;text-underline-offset:3px;
    transition:color .2s ease;
  }
  a:hover{color:var(--coral)}
</style>
<script defer="" src="/_vercel/insights/script.js"></script></head>
<body>
<div>
<div class="code">404</div>
<h1>Struja ovdje ne teče.</h1>
<p>Ove stranice nema, ali splav i dalje plovi.</p>
<a href="/">Natrag na MojBiznis →</a>
</div>
</body>
</html>
